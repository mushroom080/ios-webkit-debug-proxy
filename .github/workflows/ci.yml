name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config \
            libimobiledevice-dev libplist-dev libusbmuxd-dev libssl-dev

      - name: Generate configure script
        run: NOCONFIGURE=1 ./autogen.sh

      - name: Build and test (default)
        run: |
          mkdir build-default
          cd build-default
          ../configure
          make -j"$(nproc)"
          make check VERBOSE=1
          ./src/ios_webkit_debug_proxy -V

      - name: Build and test (ASan + UBSan)
        run: |
          mkdir build-asan
          cd build-asan
          ../configure CFLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1"
          make -j"$(nproc)"
          ASAN_OPTIONS=detect_leaks=1 make check VERBOSE=1

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          brew update
          brew install autoconf automake libtool pkg-config \
            libimobiledevice libplist libusbmuxd openssl

      - name: Build and test
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix openssl)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          ./autogen.sh
          make -j"$(sysctl -n hw.ncpu)"
          make check VERBOSE=1
          ./src/ios_webkit_debug_proxy -V

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-autotools
            mingw-w64-ucrt-x86_64-libimobiledevice
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-libusbmuxd
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-pcre

      - name: Build and test
        run: |
          ./autogen.sh
          make -j"$(nproc)"
          make check VERBOSE=1
          ./src/ios_webkit_debug_proxy -V

      - name: Install Windows executable
        run: |
          set -euo pipefail
          mkdir -p dist
          make -C src install-exec bindir="$PWD/dist"
          test -f dist/ios_webkit_debug_proxy.exe

      - name: Bundle runtime dependencies
        run: |
          set -euo pipefail

          system32="$(cygpath -u "${SYSTEMROOT:-${SystemRoot:-C:/Windows}}")/System32"

          collect_deps() {
            local file="$1"
            local deps dll source

            echo "Scanning: $file"

            deps=$(objdump -p "$file" | tr -d '\r' | awk '/DLL Name:/ {print $3}')

            while IFS= read -r dll; do
              [[ -n "$dll" ]] || continue

              dll="${dll,,}"
              source="$MINGW_PREFIX/bin/$dll"

              if [[ -f "dist/$dll" ]]; then
                continue
              elif [[ -f "$source" ]]; then
                echo "Bundling: $dll"
                cp "$source" "dist/$dll"
                collect_deps "dist/$dll"
              elif [[ "$dll" == api-ms-win-* ||
                      "$dll" == ext-ms-* ||
                      -f "$system32/$dll" ]]; then
                echo "System DLL: $dll"
              else
                echo "::error::Unresolved dependency: $dll (required by $file)"
                return 1
              fi
            done <<< "$deps"
          }

          collect_deps dist/ios_webkit_debug_proxy.exe

          ls -lh dist/

      - name: Test portable Windows binary
        shell: pwsh
        run: |
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          Set-Location dist

          $process = Start-Process `
            -FilePath ".\ios_webkit_debug_proxy.exe" `
            -ArgumentList "-V" `
            -NoNewWindow `
            -Wait `
            -PassThru

          $code = $process.ExitCode

          Write-Host "Exit code: $code (0x$('{0:X8}' -f $code))"

          if ($code -ne 0) {
            throw "Portable binary test failed: $code"
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-webkit-debug-proxy-win64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
